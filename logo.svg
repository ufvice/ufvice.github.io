  <path d="M150,40 L170,40" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
  <path d="M150,160 L170,160" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
  <path d="M40,160 L60,160" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
</svg>